<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color:#4285f4; }
      .ColorScheme-Highlight { color:#4285f4; }
    </style>
  </defs>
  <!-- Centering group for the 32x32 canvas -->
  <g transform="translate(2, -3.5)">
    <!-- Background Layer: Top right capsule, lower opacity (0.45) -->
