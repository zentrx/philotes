      x="6" y="9" width="20" height="12" rx="6" ry="6" />
    <!-- Foreground Layer: Bottom left speech bubble, higher opacity (0.85) -->
    <path 
      class="ColorScheme-Text" 
      fill="currentColor" 
      fill-opacity="0.85" 
      d="M 8,14 C 4.686,14 2,16.686 2,20 C 2,21.5 2.5,22.8 3.5,23.8 L 3,30 L 9,26 L 16,26 C 19.314,26 22,23.314 22,20 C 22,16.686 19.314,14 16,14 Z" />
  </g>
</svg>
