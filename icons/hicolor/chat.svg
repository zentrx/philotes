    <!-- Foreground Layer: bubble shape in foreground position, higher opacity (0.85) -->
    <path d="M 8,11 H 17 C 18.66,11 20,12.34 20,14 V 20 C 20,21.66 18.66,23 17,23 H 11 L 7,26.5 V 23 C 5.34,23 4,21.66 4,20 V 14 C 4,12.34 5.34,11 8,11 Z" class="ColorScheme-Text" fill="currentColor" fill-opacity="0.85" />
  </g>
</svg>
