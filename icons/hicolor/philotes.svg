<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .Google-Blue { color:#4285f4; }
      .Google-Green { color:#34a853; }
      .Google-Yellow { color:#fbbc05; }
    </style>
    <!-- Mask to cut out the foreground chat bubble and the calendar from the background chat bubble -->
    <mask id="bg-bubble-mask">
      <rect x="0" y="0" width="32" height="32" fill="white" />
      <!-- Cut out foreground chat bubble (1.5px stroke cutout) -->
      <path d="M 8,11 H 17 C 18.66,11 20,12.34 20,14 V 20 C 20,21.66 18.66,23 17,23 H 11 L 7,26.5 V 23 C 5.34,23 4,21.66 4,20 V 14 C 4,12.34 5.34,11 8,11 Z" fill="black" stroke="black" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Cut out calendar with a uniform 0.75px gap matching the blue-green spacing (2.7 for body, 1.5 for prongs) -->
      <rect x="17" y="16" width="10" height="10" rx="2" fill="black" stroke="black" stroke-width="2.7" stroke-linejoin="round" />
      <rect x="19" y="14.5" width="1" height="2" rx="0.5" fill="black" stroke="black" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="24" y="14.5" width="1" height="2" rx="0.5" fill="black" stroke="black" stroke-width="1.5" stroke-linejoin="round" />
    </mask>
    <!-- Mask to cut out the calendar icon from the foreground chat bubble with a uniform 0.75px gap -->
    <mask id="fg-bubble-mask">
      <rect x="0" y="0" width="32" height="32" fill="white" />
      <rect x="17" y="16" width="10" height="10" rx="2" fill="black" stroke="black" stroke-width="2.7" stroke-linejoin="round" />
      <rect x="19" y="14.5" width="1" height="2" rx="0.5" fill="black" stroke="black" stroke-width="1.5" stroke-linejoin="round" />
      <rect x="24" y="14.5" width="1" height="2" rx="0.5" fill="black" stroke="black" stroke-width="1.5" stroke-linejoin="round" />
    </mask>
  </defs>
  
  <!-- Background speech bubble (Google Messages representation - Blue - Capsule shape - Slightly larger) -->
  <rect x="12" y="6" width="15" height="10" rx="5" ry="5" class="Google-Blue" fill="currentColor" fill-opacity="0.45" mask="url(#bg-bubble-mask)" />
  
  <!-- Foreground speech bubble (Google Chat representation - Green) -->
  <path d="M 8,11 H 17 C 18.66,11 20,12.34 20,14 V 20 C 20,21.66 18.66,23 17,23 H 11 L 7,26.5 V 23 C 5.34,23 4,21.66 4,20 V 14 C 4,12.34 5.34,11 8,11 Z" class="Google-Green" fill="currentColor" fill-opacity="0.85" mask="url(#fg-bubble-mask)" />
  
  <!-- Calendar Icon at bottom right (Yellow) -->
  <g class="Google-Yellow">
    <!-- Calendar hangers (prongs) -->
    <rect x="19" y="14.5" width="1" height="2" rx="0.5" fill="currentColor" />
    <rect x="24" y="14.5" width="1" height="2" rx="0.5" fill="currentColor" />
    
    <!-- Calendar outer frame -->
    <rect x="17" y="16" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Calendar top header separator line -->
    <line x1="17" y1="19.5" x2="27" y2="19.5" stroke="currentColor" stroke-width="1.2" />
    
    <!-- Calendar grid dots -->
    <rect x="19" y="21" width="1.5" height="1.5" rx="0.3" fill="currentColor" fill-opacity="0.85" />
    <rect x="23.5" y="21" width="1.5" height="1.5" rx="0.3" fill="currentColor" fill-opacity="0.85" />
    <rect x="19" y="23.5" width="1.5" height="1.5" rx="0.3" fill="currentColor" fill-opacity="0.85" />
    <rect x="23.5" y="23.5" width="1.5" height="1.5" rx="0.3" fill="currentColor" fill-opacity="0.85" />
  </g>
</svg>
